name: Temporary ARASAAC candidate pack

on:
  push:
    branches:
      - tmp/arasaac-pack
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Resolve final candidates
        shell: bash
        run: |
          cat > /tmp/fetch.py <<'PY'
          import io,json,os
          from urllib.parse import quote
          import requests
          from PIL import Image,ImageDraw
          targets={
            'log':['tree trunk','firewood','wood','log'],
            'mat':['floor mat','door mat','doormat','welcome mat','mat'],
            'hog':['wild boar','hog','pig'],
          }
          s=requests.Session(); s.headers['User-Agent']='sensory-schoolwork asset curation'
          os.makedirs('candidate-pack-3/contact',exist_ok=True); out={}
          for word,terms in targets.items():
            seen=set(); cs=[]
            for term in terms:
              for mode in ('bestsearch','search'):
                try:
                  r=s.get(f'https://api.arasaac.org/v1/pictograms/en/{mode}/{quote(term)}',timeout=30)
                  arr=r.json() if r.ok else []
                except Exception: arr=[]
                for obj in arr[:10]:
                  pid=int(obj['_id'])
                  if pid in seen: continue
                  seen.add(pid); kws=[k.get('keyword') for k in obj.get('keywords',[]) if isinstance(k,dict) and k.get('keyword')]
                  cs.append({'id':pid,'keywords':kws[:10],'query':term})
                  if len(cs)>=16: break
                if len(cs)>=16: break
              if len(cs)>=16: break
            out[word]=cs; tiles=[]
            for c in cs:
              pid=c['id']
              try:
                r=s.get(f'https://static.arasaac.org/pictograms/{pid}/{pid}_500.png',timeout=30); r.raise_for_status()
                im=Image.open(io.BytesIO(r.content)).convert('RGB'); im.thumbnail((240,240))
                t=Image.new('RGB',(270,320),'white'); t.paste(im,((270-im.width)//2,5)); d=ImageDraw.Draw(t)
                d.text((6,250),f'{word} | {pid}',fill='black'); d.text((6,270),', '.join(c['keywords'][:4])[:40],fill='black'); d.text((6,295),c['query'][:40],fill='black'); tiles.append(t)
              except Exception as e: print('image',word,pid,e)
            if tiles:
              cols=4; rows=(len(tiles)+3)//4; sh=Image.new('RGB',(270*cols,320*rows),'#ddd')
              for i,t in enumerate(tiles): sh.paste(t,((i%4)*270,(i//4)*320))
              sh.save(f'candidate-pack-3/contact/{word}.jpg',quality=90)
            print(word,[(c['id'],c['keywords'][:4],c['query']) for c in cs],flush=True)
          json.dump(out,open('candidate-pack-3/candidates.json','w'),indent=2)
          PY
          python /tmp/fetch.py
      - uses: actions/upload-artifact@v4
        with:
          name: arasaac-candidates-3
          path: candidate-pack-3
