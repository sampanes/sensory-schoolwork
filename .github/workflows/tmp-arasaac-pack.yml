name: Temporary ARASAAC candidate pack

on:
  push:
    branches:
      - tmp/arasaac-pack

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Fetch refined ARASAAC candidates
        shell: bash
        run: |
          cat > /tmp/fetch.py <<'PY'
          import io, json, os
          from urllib.parse import quote
          import requests
          from PIL import Image, ImageDraw

          targets = {
            'bat': ['bat', 'flying mammal'],
            'rat': ['rat', 'mouse', 'rodent'],
            'van': ['van', 'minivan', 'delivery van'],
            'jam': ['jam', 'fruit jam', 'marmalade'],
            'yam': ['yam', 'sweet potato'],
            'fin': ['fin', 'fish fin'],
            'jug': ['jug', 'pitcher'],
            'mug': ['mug', 'coffee mug', 'cup'],
            'pet': ['pet', 'domestic animal', 'companion animal'],
            'fig': ['fig', 'fig fruit'],
            'log': ['log', 'tree trunk', 'wood trunk'],
            'ham': ['ham'],
            'bin': ['bin', 'trash bin', 'waste bin'],
            'bug': ['bug', 'insect'],
            'cap': ['cap'],
          }

          session = requests.Session(); session.headers['User-Agent']='sensory-schoolwork asset curation'
          os.makedirs('candidate-pack-2/contact', exist_ok=True)
          data={}

          def results(term):
            out=[]
            for mode in ('bestsearch','search'):
              try:
                r=session.get(f'https://api.arasaac.org/v1/pictograms/en/{mode}/{quote(term)}',timeout=30)
                if r.ok and isinstance(r.json(),list): out.extend(r.json())
              except Exception as e: print('SEARCH ERROR',term,mode,e,flush=True)
            return out

          for word, terms in targets.items():
            seen=set(); cs=[]
            for term in terms:
              for obj in results(term)[:12]:
                pid=int(obj['_id'])
                if pid in seen: continue
                seen.add(pid)
                kws=[k.get('keyword') for k in obj.get('keywords',[]) if isinstance(k,dict) and k.get('keyword')]
                cs.append({'id':pid,'keywords':kws[:10],'query':term})
                if len(cs)>=12: break
              if len(cs)>=12: break
            data[word]=cs
            tiles=[]
            for c in cs:
              pid=c['id']
              try:
                r=session.get(f'https://static.arasaac.org/pictograms/{pid}/{pid}_500.png',timeout=30); r.raise_for_status()
                im=Image.open(io.BytesIO(r.content)).convert('RGB'); im.thumbnail((250,250))
                tile=Image.new('RGB',(280,335),'white'); tile.paste(im,((280-im.width)//2,5))
                d=ImageDraw.Draw(tile); d.text((7,260),f'{word} | {pid}',fill='black'); d.text((7,280),', '.join(c['keywords'][:4])[:40],fill='black'); d.text((7,305),c['query'][:40],fill='black')
                tiles.append(tile)
              except Exception as e: print('IMAGE ERROR',word,pid,e,flush=True)
            if tiles:
              cols=4; rows=(len(tiles)+cols-1)//cols
              sheet=Image.new('RGB',(280*cols,335*rows),'#ddd')
              for i,t in enumerate(tiles): sheet.paste(t,((i%cols)*280,(i//cols)*335))
              sheet.save(f'candidate-pack-2/contact/{word}.jpg',quality=90)
            print(word,[(c['id'],c['keywords'][:3],c['query']) for c in cs],flush=True)
          with open('candidate-pack-2/candidates.json','w') as f: json.dump(data,f,indent=2)
          PY
          python /tmp/fetch.py
      - uses: actions/upload-artifact@v4
        with:
          name: arasaac-candidates-2
          path: candidate-pack-2
